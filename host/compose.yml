# A host runs a published image: copy this folder (with its config/ and backups/ folders)
# and a filled-in .env, then
#   docker compose pull && docker compose up -d
# Upgrading is the same two commands after changing TAG.
name: ${COMPOSE_PROJECT_NAME:-moodle}

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/tropotek/moodle-${INSTITUTION:-demo}:${TAG:-latest}}
  env_file: .env
  restart: unless-stopped

# Shared by the preupgrade and dbtools services. BACKUP_DIR must exist: compose refuses
# a missing one rather than creating it as root.
x-dbtools: &dbtools
  image: ${DBTOOLS_IMAGE:-ghcr.io/tropotek/moodle-dbtools:${TAG:-latest}}
  env_file: .env
  environment:
    SIS_TARGET_INSTITUTION: ${INSTITUTION:-demo}
  volumes:
    - moodledata:/moodledata
    - hostmarker:/sis/host:ro,nocopy
    - type: bind
      source: ${BACKUP_DIR:-./backups}
      target: /backups
      bind:
        create_host_path: false

services:
  app:
    <<: *app
    # A stop during an upgrade would otherwise kill upgrade.php after 10 seconds and
    # can leave the database half-upgraded.
    stop_grace_period: 10m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - moodledata:/moodledata
      - hostmarker:/sis/host:ro,nocopy
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
      # Optional settings.json that overrides the institution's; see README.md.
      - ./config:/sis/config:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/sis/run/booted"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy
        required: false
      preupgrade:
        condition: service_completed_successfully

  cron:
    <<: *app
    command: ["sis-cron"]
    # The base image's healthcheck polls Caddy, which only the app container runs.
    healthcheck:
      disable: true
    volumes:
      - moodledata:/moodledata
      - hostmarker:/sis/host:ro,nocopy
      - ./config:/sis/config:ro
    depends_on:
      - app

  # Runs before app on every start. When the release changes, it backs up to
  # backups/pre-<release> first; a failed backup stops the upgrade. See docs/upgrading.md.
  preupgrade:
    <<: *dbtools
    command: ["sis-preupgrade"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Backup and restore by hand; up skips it, and pull fetches its image for preupgrade:
  #   docker compose run --rm dbtools sis-backup
  #   docker compose run --rm dbtools sis-restore <name>
  dbtools:
    <<: *dbtools
    profiles: [tools]

  # The bundled MySQL 8.4 database. It runs only when .env sets COMPOSE_PROFILES=db; for an
  # external server, leave that out and set DB_HOST, DB_PORT, DB_NAME, DB_USER and DB_PASS.
  db:
    image: mysql:8.4
    profiles: [db]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-moodle}
      MYSQL_USER: ${DB_USER:-moodle}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is required}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
      - --innodb-file-per-table=1
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      retries: 30

volumes:
  moodledata:
  caddy_data:
  caddy_config:
  db:
  # Environment protection: the site refuses an SIS_ENV that disagrees with this host's marker
  # in /etc/tkmoodle (devserver, uat or production). On a server, create the folder and its
  # marker, then uncomment the driver_opts line; see
  # https://tropotek.github.io/tkmoodle/configuration/#host-markers. If the site has already
  # started, run docker compose down and docker volume rm <project>_hostmarker first. Left
  # commented, nothing on the host is read and only SIS_ENV=local starts.
  # nocopy: Docker would otherwise copy the image folder's owner onto /etc/tkmoodle.
  hostmarker:
    # driver_opts: {type: none, o: bind, device: /etc/tkmoodle}
