# A host runs a published image: copy this folder with a filled-in .env, then
#   docker compose pull && docker compose up -d
# Upgrading is the same two commands after changing TAG.
name: ${COMPOSE_PROJECT_NAME:-moodle}

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/tropotek/moodle-${INSTITUTION:-demo}:${TAG:-latest}}
  env_file: .env
  restart: unless-stopped

services:
  app:
    <<: *app
    # A stop during an upgrade would otherwise kill upgrade.php after 10 seconds and
    # can leave the database half-upgraded.
    stop_grace_period: 10m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - moodledata:/moodledata
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
      # Optional settings.json that overrides the institution's; see README.md.
      - ./config:/sis/config:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/sis/run/booted"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy

  cron:
    <<: *app
    command: ["sis-cron"]
    # The base image's healthcheck polls Caddy, which only the app container runs.
    healthcheck:
      disable: true
    volumes:
      - moodledata:/moodledata
      - ./config:/sis/config:ro
    depends_on:
      - app

  # Bundled database, on by default. To use an external MySQL 8.4 server instead:
  # delete this service, the depends_on under app, and the db volume below, then set
  # DB_HOST, DB_PORT, DB_NAME, DB_USER and DB_PASS in .env.
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-moodle}
      MYSQL_USER: ${DB_USER:-moodle}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is required}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
      - --innodb-file-per-table=1
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      retries: 30

volumes:
  moodledata:
  caddy_data:
  caddy_config:
  db:
