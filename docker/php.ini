; Moodle PHP settings
max_input_vars = 5000
memory_limit = 512M
post_max_size = 256M
upload_max_filesize = 256M
max_execution_time = 300
opcache.enable = 1
opcache.jit = off
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
