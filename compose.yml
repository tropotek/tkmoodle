# Local development: the dev stack, at the repo root so `docker compose` finds it. Start it
# with bin/dev, which builds the images it runs. Settings: copy .env.example to .env.
# Plugin code is bind-mounted, so edits are live; harness changes need bin/dev up (a cached rebuild).
name: moodle-dev

x-env: &env
  WWWROOT: http://localhost:${DEV_PORT:-8300}
  DB_HOST: db
  DB_PASS: dev
  ADMIN_PASS: Dev-Admin-1
  SITE_FULLNAME: ${SITE_FULLNAME:-Moodle (dev)}
  SISEXAMPLE_REMOTE_URL: ${SISEXAMPLE_REMOTE_URL:-https://remote.example.test}
  SISEXAMPLE_SSO_ISSUER: ${SISEXAMPLE_SSO_ISSUER:-}
  SISEXAMPLE_SSO_CLIENT_ID: ${SISEXAMPLE_SSO_CLIENT_ID:-}
  SISEXAMPLE_SSO_SECRET: ${SISEXAMPLE_SSO_SECRET:-}

x-mounts: &mounts
  - moodledata:/moodledata
  - ./plugins/local/sisexample:/app/moodle/public/local/sisexample

services:
  app:
    image: ${APP_IMAGE:-moodle:dev}
    environment: *env
    ports:
      - "${DEV_PORT:-8300}:80"
    volumes: *mounts
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: ${APP_IMAGE:-moodle:dev}
    command: ["sis-cron"]
    # The base image's healthcheck polls Caddy, which only the app container runs.
    healthcheck:
      disable: true
    environment: *env
    volumes: *mounts
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: dev
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=256M"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umoodle -pdev --silent"]
      interval: 5s
      retries: 30

volumes:
  moodledata:
  db:
