name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tropotek

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag (v5.3.0-1 -> 5.3.0-1); its core must match composer.lock
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ ! "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
            echo "::error::tag must look like v5.3.0-1, got $GITHUB_REF_NAME"; exit 1
          fi
          core="${BASH_REMATCH[1]}"
          lock=$(jq -r '.packages[] | select(.name == "moodle/moodle") | .version | ltrimstr("v")' composer.lock)
          if [[ "$core" != "$lock" ]]; then
            echo "::error::tag says Moodle $core but composer.lock has $lock"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/moodle:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  list:
    runs-on: ubuntu-24.04
    outputs:
      institutions: ${{ steps.list.outputs.institutions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          names=$(find institutions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "institutions=$names" >> "$GITHUB_OUTPUT"

  institutions:
    needs: [base, list]
    if: needs.list.outputs.institutions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        institution: ${{ fromJSON(needs.list.outputs.institutions) }}
    steps:
      - uses: actions/checkout@v4

      - name: check-lock
        run: bin/check-lock "${{ matrix.institution }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.institution }}
        uses: docker/build-push-action@v6
        with:
          context: institutions/${{ matrix.institution }}
          file: institutions/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/moodle@${{ needs.base.outputs.digest }}
          labels: org.opencontainers.image.source=https://github.com/tropotek/tkmoodle
          tags: |
            ${{ env.REGISTRY }}/moodle-${{ matrix.institution }}:${{ needs.base.outputs.version }}
            ${{ env.REGISTRY }}/moodle-${{ matrix.institution }}:latest
          cache-from: type=gha,scope=inst-${{ matrix.institution }}
          cache-to: type=gha,scope=inst-${{ matrix.institution }},mode=max
